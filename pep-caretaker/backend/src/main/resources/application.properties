# datasource configuration
quarkus.datasource.db-kind = postgresql
quarkus.datasource.username = app
quarkus.datasource.password = app
quarkus.datasource.jdbc.url = jdbc:postgresql://localhost:5432/db
%dev.quarkus.datasource.jdbc.url = jdbc:postgresql://localhost:5432/db
quarkus.datasource.jdbc.transactions=enabled
quarkus.datasource.jdbc.pooling-enabled=true

# drop and create the database at startup (use `update` to only update the schema)
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%prod.quarkus.hibernate-orm.schema-management.strategy=create

quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.log.sql=true
quarkus.http.access-log.enabled=true

# OIDC / Keycloak (realm "pepper", roles: admin, caretaker, resident)
quarkus.oidc.client-id=pepper-backend
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles
pepper.oidc.frontend-client-id=angular-frontend
%dev.quarkus.oidc.auth-server-url=http://localhost:8081/realms/pepper
%prod.quarkus.oidc.auth-server-url=https://vm107.htl-leonding.ac.at/auth/realms/pepper
# tests use @TestSecurity identities, no real Keycloak needed
%test.quarkus.oidc.enabled=false

# CORS restricted to known frontends
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=https://vm107.htl-leonding.ac.at,http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=Accept,Authorization,Content-Type,Origin,X-Requested-With
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H

quarkus.http.limits.max-body-size=50M

# all REST endpoints live under /api (nginx proxies /api/ -> :8080/api/, Android calls :8080/api/ directly)
quarkus.http.root-path=/api
# keep health/dev-ui at absolute /q
quarkus.http.non-application-root-path=/q

quarkus.package.jar.type=uber-jar

# MinIO object storage (binary image data; Postgres keeps only metadata)
pepper.minio.bucket=pep-caretaker-images
pepper.minio.enabled=true
%dev.quarkus.minio.host=http://localhost:9000
%dev.quarkus.minio.access-key=admin
%dev.quarkus.minio.secret-key=admin123
%prod.quarkus.minio.host=${MINIO_URL}
%prod.quarkus.minio.access-key=${MINIO_ACCESS_KEY}
%prod.quarkus.minio.secret-key=${MINIO_SECRET_KEY}
%test.pepper.minio.enabled=false
%test.quarkus.minio.devservices.enabled=false
%test.quarkus.minio.host=http://localhost:9000
%test.quarkus.minio.access-key=test
%test.quarkus.minio.secret-key=test

quarkus.http.proxy.proxy-address-forwarding=true

# Swagger UI / OpenAPI Configuration
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
mp.openapi.extensions.smallrye.info.title=Pepper Caretaker API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=REST API for Pepper Robot Caretaker Backend
