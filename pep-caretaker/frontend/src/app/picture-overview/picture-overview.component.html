<div class="p-8 min-h-screen"> <!-- Heller Hintergrund -->
  
  <button (click)="goToUpload()" style="background-color: #FA7F08;" class="mt-0 w-full py-3 text-white font-semibold rounded-lg shadow-md hover:bg-blue-500">
    NEUES BILD HOCHLADEN
  </button>

  <div class="flex justify-between items-center mt-8">
    <h1 class="text-3xl font-bold">Bilder - Überblick</h1>
    <h1 class="text-3xl font-bold">{{images().length}} / {{standartImages().length}} Bilder</h1>
  </div>
  
  <div class="mt-0">
    <button
      [ngStyle]="{ 'background-color': activeButton() === 'All' ? '#9EF8EE' : '#348888', 'color': activeButton() === 'All' ? 'black' : 'white' }"
      (click)="showAllImages()"
      class="mt-6 me-2 px-6 py-3 font-semibold rounded-lg shadow-md hover:bg-blue-500"
    >
      Alle Bilder
    </button>

    <button
      [ngStyle]="{ 'background-color': activeButton() === 'People' ? '#9EF8EE' : '#348888', 'color': activeButton() === 'People' ? 'black' : 'white' }"
      (click)="showImageOfPersons()"
      class="mt-6 me-2 px-6 py-3 font-semibold rounded-lg shadow-md hover:bg-blue-500"
    >
      Personenbezogene Bilder
    </button>

    <button
      [ngStyle]="{ 'background-color': activeButton() === 'Stories' ? '#9EF8EE' : '#348888', 'color': activeButton() === 'Stories' ? 'black' : 'white' }"
      (click)="showImageOfStories()"
      class="mt-6 px-6 py-3 font-semibold rounded-lg shadow-md hover:bg-blue-500"
    >
      Bilder für Mitmachgeschichten
    </button>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 mt-5">
    <div *ngFor="let image of images()" class="bg-white shadow-lg rounded-lg overflow-hidden" (click)="openPreview(image)">
      <!-- Thumbnail card: padded container with contain to show full image -->
      <div class="p-3">
        <div class="w-full bg-gray-50 rounded-md overflow-hidden flex items-center justify-center" style="height:12rem;">
          <img [appAuthSrc]="pictureUrl(image?.id)"
               [alt]="image.description"
               loading="lazy"
               class="max-w-full max-h-full object-contain rounded-md transition-transform duration-200 hover:scale-105">
        </div>
        <div style="background-color: #9EF8EE;" class="p-3 text-black text-center font-semibold truncate" [title]="image.description">
          {{ image.description }}
        </div>
      </div>
    </div>
  </div>

  <!-- Vorschau: schließen per ✕, Klick auf den Hintergrund oder Escape -->
  <div *ngIf="selectedImage()" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4"
       (click)="closePreview()">
    <div role="dialog" aria-modal="true" aria-labelledby="preview-title"
         class="flex max-h-full w-full max-w-3xl flex-col overflow-hidden rounded-xl bg-base-100 shadow-2xl"
         (click)="$event.stopPropagation()">
      <div class="flex items-center justify-between gap-4 border-b border-base-300 py-2 pl-5 pr-2">
        <h2 id="preview-title" class="truncate text-lg font-semibold">{{ selectedImage()?.description }}</h2>
        <button #closeButton type="button" class="btn btn-circle btn-ghost shrink-0" (click)="closePreview()"
                aria-label="Vorschau schließen" title="Schließen (Esc)">
          <svg class="h-6 w-6" aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <img
        [appAuthSrc]="pictureUrl(selectedImage()?.id, 1200)"
        [alt]="selectedImage()?.description"
        class="min-h-0 w-full flex-1 bg-base-200 object-contain"
      />

      <div class="flex justify-center gap-4 p-4">
        <button
          type="button"
          (click)="downloadImage()"
          class="px-6 py-2 bg-green-600 text-white rounded-lg shadow hover:bg-green-500"
        >
          Download
        </button>
        <button
          type="button"
          class="px-6 py-2 bg-red-600 text-white rounded-lg shadow hover:bg-red-500"
          (click)="deleteImage()"
        >
          Löschen
        </button>
      </div>
    </div>
  </div>
</div>
