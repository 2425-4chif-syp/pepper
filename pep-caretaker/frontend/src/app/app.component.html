<div id="appComp" data-theme="light" class="min-h-screen overflow-hidden bg-base-100 text-base-content">
  <nav class="fixed top-0 left-0 right-0 z-50" aria-label="Hauptnavigation">
    <div class="navbar bg-base-100">
      <div class="flex-1">
        <a routerLink="/" class="btn btn-ghost text-xl">PEPPER Dashboard</a>
      </div>
      
      <div class="flex-none gap-2">
        <!-- User Info -->
        <span class="text-sm hidden md:inline">
          Hallo, {{currentUser()}}
        </span>
        
        <!-- ✅ Logout Button mit DaisyUI Styling -->
        <button type="button" class="btn btn-error btn-sm" (click)="logout()" aria-label="Abmelden">
          <svg class="w-4 h-4" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          <span class="hidden sm:inline">Logout</span>
        </button>

                <!-- Darkmode Button -->
        <button type="button" (click)="onDarkmode()" class="btn btn-square btn-ghost" aria-label="Dunkelmodus" title="Dunkelmodus" [attr.aria-pressed]="isDarkmodeActive()">
          <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
          </svg>
        </button>
      </div>
    </div>
  </nav>

  <!-- Spacer: gleiche Höhe wie die Navbar, damit Inhalt nicht vom fixed Header überlappt wird -->
  <div class="h-16" aria-hidden="true"></div>

  <router-outlet></router-outlet>
  
</div>
