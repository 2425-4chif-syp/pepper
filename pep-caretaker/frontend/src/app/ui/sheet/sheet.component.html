<!-- Scrim dunkelt den Hintergrund ab: eine Aufgabe im Vordergrund, der Rest tritt zurück -->
<div class="sheet-backdrop" (mousedown)="onBackdropPointerDown($event)" (keydown)="onKeydown($event)">
  <div #panel class="sheet-panel surface-card" role="dialog" aria-modal="true"
       [attr.aria-label]="heading" tabindex="-1">

    <header class="flex items-center justify-between gap-4 border-b border-base-300/60 px-5 py-4">
      <h2 class="t-title3 min-w-0 truncate">{{ heading }}</h2>
      <button type="button" class="btn btn-ghost btn-sm btn-circle pressable"
              (click)="close()" [attr.aria-label]="closeLabel">
        <svg xmlns="http://www.w3.org/2000/svg" class="size-5" fill="none" viewBox="0 0 24 24"
             stroke-width="1.8" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </header>

    <div class="flex min-h-0 flex-1 flex-col overflow-auto">
      <ng-content></ng-content>
    </div>

    <footer class="border-t border-base-300/60 px-5 py-4">
      <ng-content select="[sheetActions]"></ng-content>
    </footer>
  </div>
</div>
