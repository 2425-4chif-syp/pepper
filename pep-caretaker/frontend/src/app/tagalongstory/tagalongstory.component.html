<div class="mx-auto max-w-5xl px-4 py-8 pb-32 sm:px-6">

  <header class="mb-8 text-center">
    <h1 class="t-display">Mit-Mach-Geschichten</h1>
    <p class="t-callout mt-1 text-base-content/55">
      Geschichten für den Pepper anlegen, ansehen und bearbeiten
    </p>
  </header>

  <!-- Ladeanzeige über der Seite -->
  <div *ngIf="loading" class="fixed inset-0 z-50 flex items-center justify-center bg-base-100/70 backdrop-blur-sm">
    <div class="flex flex-col items-center gap-4">
      <span class="loading loading-spinner loading-lg text-primary"></span>
      <div class="t-body font-medium text-base-content/70">Geschichten werden geladen</div>
      <div class="loader-dots mt-1 flex items-center"></div>
    </div>
  </div>

  <label class="input input-bordered mx-auto mb-8 flex max-w-md items-center gap-2 bg-base-100">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
         class="size-4 shrink-0 text-base-content/45" aria-hidden="true">
      <path fill-rule="evenodd"
        d="M9.965 11.026a5 5 0 1 1 1.06-1.06l2.755 2.754a.75.75 0 1 1-1.06 1.06l-2.755-2.754ZM10.5 7a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0Z"
        clip-rule="evenodd" />
    </svg>
    <input type="text" class="grow bg-transparent" placeholder="Suche"
           aria-label="Geschichten durchsuchen"
           [(ngModel)]="searchTerm" (input)="filterStories()" />
  </label>

  <ul class="flex flex-col gap-3">
    <li *ngFor="let story of filteredStories; let i = index"
        class="surface-card flex items-center gap-4 p-3 sm:p-4">

      <!-- Titelbild -->
      <div class="shrink-0">
        <ng-container *ngIf="hasValidImageFromStory(story); else defaultImage">
          <img
            [appAuthSrc]="getImageSrcFromStory(story)"
            [alt]="story.name + ' Titelbild'"
            class="size-14 rounded-control border border-base-300/60 object-cover"
            decoding="async"
            (error)="onImageError($event)"
          />
        </ng-container>
        <ng-template #defaultImage>
          <div class="flex size-14 items-center justify-center rounded-control border border-base-300/60 bg-base-200">
            <svg class="size-7 text-base-content/35" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
              <path fill-rule="evenodd" d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z" clip-rule="evenodd" />
            </svg>
          </div>
        </ng-template>
      </div>

      <!-- Name -->
      <div class="min-w-0 grow">
        <span class="t-title3 block truncate">{{story.name || 'Unbenannte Geschichte'}}</span>
      </div>

      <div class="ml-auto flex shrink-0 items-center gap-1">
        <div class="tooltip" data-tip="Vorschau ansehen">
          <a [routerLink]="['/previewScreen', story.id]"
             class="btn btn-ghost btn-sm btn-circle pressable"
             [attr.aria-label]="'Vorschau von ' + story.name">
            <svg xmlns="http://www.w3.org/2000/svg" class="size-5" fill="none" viewBox="0 0 24 24"
                 stroke-width="1.6" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
          </a>
        </div>
        <div class="tooltip" data-tip="Geschichte bearbeiten">
          <button type="button" (click)="editStory(story)"
                  class="btn btn-ghost btn-sm btn-circle pressable"
                  [attr.aria-label]="story.name + ' bearbeiten'">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-5" aria-hidden="true">
              <path d="M21.731 2.269a2.625 2.625 0 0 0-3.712 0l-1.157 1.157 3.712 3.712 1.157-1.157a2.625 2.625 0 0 0 0-3.712ZM19.513 8.199l-3.712-3.712-12.15 12.15a5.25 5.25 0 0 0-1.32 2.214l-.8 2.685a.75.75 0 0 0 .933.933l2.685-.8a5.25 5.25 0 0 0 2.214-1.32L19.513 8.2Z" />
            </svg>
          </button>
        </div>
        <div class="tooltip" data-tip="Die Geschichte wird gelöscht, die Bilder jedoch erhalten.">
          <button type="button" (click)="deleteStoryWithId(story.id, story.name)"
                  class="btn btn-ghost btn-sm btn-circle pressable text-base-content/50 hover:bg-error/10 hover:text-error"
                  [attr.aria-label]="story.name + ' löschen'">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-5" aria-hidden="true">
              <path fill-rule="evenodd" d="M16.5 4.478v.227a48.816 48.816 0 0 1 3.878.512.75.75 0 1 1-.256 1.478l-.209-.035-1.005 13.07a3 3 0 0 1-2.991 2.77H8.084a3 3 0 0 1-2.991-2.77L4.087 6.66l-.209.035a.75.75 0 0 1-.256-1.478A48.567 48.567 0 0 1 7.5 4.705v-.227c0-1.564 1.213-2.9 2.816-2.951a52.662 52.662 0 0 1 3.369 0c1.603.051 2.815 1.387 2.815 2.951Zm-6.136-1.452a51.196 51.196 0 0 1 3.273 0C14.39 3.05 15 3.684 15 4.478v.113a49.488 49.488 0 0 0-6 0v-.113c0-.794.609-1.428 1.364-1.452Zm-.355 5.945a.75.75 0 1 0-1.5.058l.347 9a.75.75 0 1 0 1.499-.058l-.346-9Zm5.48.058a.75.75 0 1 0-1.498-.058l-.347 9a.75.75 0 0 0 1.5.058l.345-9Z" clip-rule="evenodd" />
            </svg>
          </button>
        </div>
      </div>
    </li>
  </ul>

  <p *ngIf="!loading && filteredStories.length === 0" class="t-callout py-16 text-center text-base-content/55">
    Keine Geschichte gefunden.
  </p>
</div>

<!-- Primäre Aktion bleibt erreichbar; transluzent, damit die Liste dahinter durchscheint -->
<div class="material fixed bottom-0 left-0 z-40 flex w-full justify-center border-t border-base-300/50 p-4">
  <button type="button" routerLink="/createstory" class="btn btn-primary btn-lg pressable">
    Erstelle eine Geschichte
  </button>
</div>
