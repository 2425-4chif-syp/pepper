# ===== DEV (lokal) =====
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/db
%dev.quarkus.datasource.username=app
%dev.quarkus.datasource.password=app
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%dev.quarkus.hibernate-orm.sql-load-script=import.sql

# ===== PROD (Schul-VM / Deployment) =====
# NIE eine unprofilierte schema-management.strategy hier eintragen: eine solche
# Zeile gewinnt gegen %prod und hat die Produktionsdatenbank bei jedem Deploy
# neu angelegt (drop-and-create).
%prod.quarkus.hibernate-orm.schema-management.strategy=validate

# ===== OIDC / Keycloak =====
# Gleiches Realm und gleicher Frontend-Client wie pep-caretaker: das Angular-
# Frontend meldet sich mit "angular-frontend" an, die Pepper-Apps mit dem
# Service-Account "pepper-robot". KeycloakRoleAugmentor fuehrt die Rollen aus
# realm_access und resource_access.<frontend-client> zusammen.
quarkus.oidc.client-id=pep-mealplan-backend
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles
pepper.oidc.frontend-client-id=angular-frontend
%dev.quarkus.oidc.auth-server-url=http://localhost:8081/realms/pepper
%prod.quarkus.oidc.auth-server-url=${QUARKUS_OIDC_AUTH_SERVER_URL:https://vm107.htl-leonding.ac.at/auth/realms/pepper}
# Tests authentifizieren ueber @TestSecurity, kein echtes Keycloak noetig.
%test.quarkus.oidc.enabled=false

# ===== CORS =====
# Frueher von CorsFilter.java / CorsPreflightFilter.java per Hand gesetzt - die
# haben "Access-Control-Allow-Origin: *" an jede Antwort gehaengt. Die Quarkus-
# Erweiterung macht dasselbe gegen eine Positivliste.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=https://vm107.htl-leonding.ac.at,http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=Accept,Authorization,Content-Type,Origin,X-Requested-With
quarkus.http.cors.access-control-max-age=24H

# Image upload settings
quarkus.http.limits.max-body-size=50M
quarkus.datasource.jdbc.auto-commit=false

# Swagger/OpenAPI nur ausserhalb von prod ausliefern
%prod.quarkus.swagger-ui.enable=false
