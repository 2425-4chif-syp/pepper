name: Build and Deploy Pepper-Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'pep-caretaker/frontend/**'
      - 'deploy/compose/**'
      - '.github/workflows/build-deploy-frontend.yaml'
  workflow_dispatch:

jobs:
  build-and-deploy-frontend:
    permissions: write-all
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Find and set image tag
        run: |
          if test "${{ github.ref_name }}" = "main"; then tag="latest"; else tag="dev"; fi
          echo "IMAGE_TAG=${tag}" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'pep-caretaker/frontend/package-lock.json'

      - name: Build frontend
        run: ./pep-caretaker/frontend/build.sh

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./pep-caretaker/frontend/docker/Dockerfile
          platforms: linux/amd64, linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/pepper-frontend:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy deployment files to VM
        if: github.ref_name == 'main'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/compose/docker-compose.yaml"
          target: /home/stuetzadm/deploy/sync
          overwrite: true

      - name: Deploy to VM
        if: github.ref_name == 'main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/stuetzadm/deploy/compose
            cp /home/stuetzadm/deploy/sync/deploy/compose/docker-compose.yaml ./docker-compose.yaml
            # Nur das Frontend austauschen. Kein "down" und kein --remove-orphans,
            # damit Postgres, Keycloak und die Mealplan-Container unberuehrt bleiben.
            # --no-deps: sonst zieht "up www" ueber depends_on auch backend, minio
            # und postgres hoch und startet sie im Zweifel neu
            docker compose -f docker-compose.yaml pull www
            docker compose -f docker-compose.yaml up -d --no-deps www
            docker image prune -f
            docker compose -f docker-compose.yaml ps
