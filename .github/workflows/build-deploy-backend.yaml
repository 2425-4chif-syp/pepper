name: Build and Deploy Pepper-Backend

on:
  push:
    branches:
      - main
    paths:
      - 'pep-caretaker/backend/**'
      - 'deploy/compose/**'
      - 'docker/keycloak-themes/**'
      - '.github/workflows/build-deploy-backend.yaml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: pep-caretaker/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Java 25: so steht es in der pom (maven.compiler.release) und im
      # Laufzeit-Image (eclipse-temurin:25-jre). Der Workflow stand noch auf 21
      # und brach mit "release version 25 not supported" ab.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TEMP_GHCR_PAT }}

      - name: Find and set image tag
        run: |
          if test "${{ github.ref_name }}" = "main"; then tag="latest"; else tag="dev"; fi
          echo "IMAGE_TAG=${tag}" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./pep-caretaker/backend
          file: ./pep-caretaker/backend/src/main/docker/Dockerfile
          platforms: linux/amd64, linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/pepper-backend:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # scp legt nur an und ueberschreibt, es loescht nichts. Ohne dieses
      # Aufraeumen bleibt eine im Repository geloeschte Theme-Datei im
      # Sync-Ordner liegen und wird bei jedem Deploy wieder mitkopiert.
      - name: Clean theme sync dir on VM
        if: github.ref_name == 'main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            rm -rf /home/stuetzadm/deploy/sync/docker/keycloak-themes/pepper

      # Compose-Datei und Login-Theme auf die VM spiegeln, damit die Konfiguration
      # aus dem Repository kommt und nicht von Hand auf dem Server gepflegt wird.
      - name: Copy deployment files to VM
        if: github.ref_name == 'main'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/compose/docker-compose.yaml,docker/keycloak-themes/pepper/**"
          target: /home/stuetzadm/deploy/sync
          overwrite: true

      - name: Deploy to VM (SSH)
        if: github.ref_name == 'main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/stuetzadm/deploy/compose
            # Aus dem Sync-Ordner an die richtige Stelle legen
            cp /home/stuetzadm/deploy/sync/deploy/compose/docker-compose.yaml ./docker-compose.yaml
            # Erst pruefen, dann das laufende Theme ersetzen: kam der scp leer
            # oder halb an, wuerde das rm -rf unten das Login-Theme im laufenden
            # Betrieb abraeumen.
            sync_theme=/home/stuetzadm/deploy/sync/docker/keycloak-themes/pepper
            test -f "$sync_theme/login/theme.properties"
            test -f "$sync_theme/login/resources/css/pepper.css"
            mkdir -p ./keycloak-themes
            rm -rf ./keycloak-themes/pepper
            cp -r "$sync_theme" ./keycloak-themes/pepper
            # Nur das Backend neu ziehen und ersetzen. Kein "down": Postgres und
            # Keycloak laufen weiter.
            # --no-deps: Postgres und MinIO laufen bereits, die sollen von einem
            # Anwendungs-Deploy nicht neu gestartet werden
            docker compose -f docker-compose.yaml pull backend
            docker compose -f docker-compose.yaml up -d --no-deps backend
            docker image prune -f
            docker compose -f docker-compose.yaml ps
