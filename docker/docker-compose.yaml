name: pepper
services:
  pep-db:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pep-keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    restart: unless-stopped
    # imports docker/keycloak/pepper-realm.json on first start (skipped if the realm already exists)
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/db
      KC_DB_USERNAME: app
      KC_DB_PASSWORD: app
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: localhost
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      # Eigenes Login-Theme; Keycloak liest Themes beim Start aus diesem Ordner
      - ./keycloak-themes/pepper:/opt/keycloak/themes/pepper:ro
    depends_on:
      - pep-db

  pep-minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Bild-Resizer vor dem Backend. Auf vm107 laeuft dasselbe unter /imagor/.
  # HTTP_LOADER_FORWARD_HEADERS gibt den Bearer-Token des Aufrufers an das Backend weiter -
  # ohne das antwortet /api/image/picture/{id} mit 401 und imagor liefert nichts.
  pep-imagor:
    image: shumc/imagor:latest
    container_name: imagor
    restart: unless-stopped
    environment:
      PORT: 8000
      IMAGOR_UNSAFE: "1"
      HTTP_LOADER_FORWARD_HEADERS: Authorization
      # Nur das eigene Backend darf als Quelle dienen.
      # Der Glob wird gegen Host UND Port geprueft - ohne ":*" lehnt imagor
      # host.docker.internal:8080 mit "http source not allowed" ab.
      HTTP_LOADER_ALLOWED_SOURCES: "host.docker.internal:*,localhost:*,backend:*"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  minio_data:
