# Pepper-Login-Theme
#
# Erbt von keycloak.v2 (PatternFly 5), damit alle Templates - Anmeldung, Passwort
# vergessen, OTP, Fehlerseiten - vom Keycloak mitkommen und bei Updates weiter passen.
# Hier wird nur das Aussehen ueberschrieben, keine einzige .ftl-Datei kopiert.
parent=keycloak.v2
import=common/keycloak

# css/styles.css kommt aus dem Elterntheme, pepper.css liegt darueber und gewinnt
styles=css/styles.css css/pepper.css
# stylesCommon wird bewusst NICHT gesetzt: Keycloak 25 liefert PatternFly unter
# node_modules/@patternfly-v5/..., Keycloak 26 unter vendor/patternfly-v5/...
# Geerbt vom Elterntheme stimmt der Pfad in beiden Versionen.

# Uebernimmt die im Dashboard gewaehlte Hell-/Dunkel-Einstellung, sofern erreichbar
scripts=js/theme-sync.js

kcBodyClass=pepper-login
